name: CI and shared-host delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build, and package
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dental_atelier
        command: --default-authentication-plugin=mysql_native_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/dental_atelier
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: github-actions-test-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Apply schema migrations
        run: npm run db:deploy
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --runInBand
      - name: Build production app
        run: npm run build
      - name: Package shared-host Node app
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          tar -czf dental-atelier-shared-host.tar.gz -C .next/standalone .
      - name: Upload shared-host artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: dental-atelier-node-${{ github.sha }}
          path: dental-atelier-shared-host.tar.gz
          if-no-files-found: error
          retention-days: 14
